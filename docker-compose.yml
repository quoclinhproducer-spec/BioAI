services:
  postgres:
    image: postgres:16-alpine
    container_name: bioai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bioai}
      POSTGRES_USER: ${POSTGRES_USER:-bioai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bioai}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bioai} -d ${POSTGRES_DB:-bioai}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: bioai-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: bioai-backend
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-replace-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql://bioai:bioai@postgres:5432/bioai?schema=public}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-mqtt://mosquitto:1883}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: bioai-web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  simulator:
    build:
      context: ./apps/simulator
      dockerfile: Dockerfile
    container_name: bioai-simulator
    environment:
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-mqtt://mosquitto:1883}
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "5001:5001"

volumes:
  postgres-data:
